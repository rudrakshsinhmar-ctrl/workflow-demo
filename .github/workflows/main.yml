name: Collaborative Workflow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index.html
        run: |
          touch index.html
          echo "<p>Updated by ${{ github.actor }} on $(date)</p>" >> index.html
      - name: Update README
        run: echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Workflow: updated HTML and README for ${{ github.actor }}" || echo "No changes"
          git push
